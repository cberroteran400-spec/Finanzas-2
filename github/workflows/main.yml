name: Finanzas APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-android:
    name: Compilar Finanzas APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Mostrar versiones
        run: |
          node --version
          npm --version
          java -version

      - name: Instalar dependencias
        run: npm install

      - name: Generar proyecto Android con Capacitor
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verificar APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Subir Finanzas APK
        uses: actions/upload-artifact@v4
        with:
          name: Finanzas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
